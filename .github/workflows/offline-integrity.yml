name: Offline product checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the offline self-test
        run: python3 -m paper2project selftest
      - name: Run security regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build the release ZIP
        run: python3 tools/package_release.py
      - name: Check whitespace
        run: git diff-tree --root --check HEAD
